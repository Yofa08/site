# ── Deal Manager — Docker Compose ───────────────────────
# Start:  docker compose up -d
# Stop:   docker compose down

services:
  app:
    build: .
    container_name: deal-manager
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ENV=prod
      - DATABASE_URL=sqlite:////app/data/deals.db
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  # ── Optional: PostgreSQL ──────────────────────────────
  # Uncomment below and set DATABASE_URL in app:
  #   DATABASE_URL=postgresql://dealuser:dealpass@db:5432/dealmanager
